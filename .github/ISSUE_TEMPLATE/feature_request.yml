name: 機能改善を提案
description: Lunoa Conciergeへの新機能・改善案を送ります
title: "[要望] "
body:
  - type: markdown
    attributes:
      value: |
        ご提案ありがとうございます。公開Issueになるため、個人情報・APIキー・トークンなどは記載しないでください。
  - type: textarea
    id: request
    attributes:
      label: 改修してほしい内容
      description: どのような機能・改善がほしいか教えてください。
      placeholder: 例：アプリ一覧でカテゴリごとに絞り込みたい
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 困っていること・実現したいこと
      description: 現在の困りごとや、この機能で解決したいことを教えてください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 端末・Lunoaバージョン（任意）
      placeholder: 例：Galaxy Z Fold 8 / Lunoa v1.0.0
  - type: textarea
    id: additional
    attributes:
      label: 補足（任意）
      description: 参考情報や画面イメージがあれば記載してください。
