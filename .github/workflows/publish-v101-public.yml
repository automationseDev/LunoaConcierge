name: Publish public v1.0.1 release

on:
  push:
    branches:
      - release/v1.0.1-public
    paths:
      - ".github/workflows/publish-v101-public.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified v1.0.1 artifact
        shell: bash
        run: |
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9064-8206-9fef-deaeaf75413a/raw?se=2026-08-31T11%3A45%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=f1f745c7-8133-5ee0-816f-a8f2f96ad9f5&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T17%3A57%3A57Z&ske=2026-08-31T17%3A57%3A57Z&sks=b&skv=2026-02-06&sig=snOITf7oGwI1/1HlnlH6yoxTpTnn4Y2JNBaaFFV22Cw%3D' -o artifact.zip
          unzip -q artifact.zip -d artifact
          APK="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" LunoaConcierge-v1.0.1.apk
          echo '38752c6aabaa023ec5dbc11c78c582fd8507501e249fa22a454d7d531745b58e  LunoaConcierge-v1.0.1.apk' | sha256sum -c -
      - name: Create public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          # Lunoa Concierge v1.0.1

          ## 更新内容

          - GitHub更新用トークンの入力・保存を廃止
          - 公開GitHub Releasesから認証情報なしで更新を確認
          - 新しいバージョンの更新内容をモダンなカードUIで表示
          - 「アップデート」「今回はしない」を選択可能
          - アップデートを選択しても自動インストールせず、Androidのインストール確認画面で最終確認
          - 既存のホームランチャー、AI会話、通知、NFC、Fold対応などの機能は維持

          ## APK

          `LunoaConcierge-v1.0.1.apk`

          SHA-256: `38752c6aabaa023ec5dbc11c78c582fd8507501e249fa22a454d7d531745b58e`
          EOF
          gh release create v1.0.1 LunoaConcierge-v1.0.1.apk \
            --repo automationseDev/LunoaConcierge \
            --title 'Lunoa Concierge v1.0.1' \
            --notes-file release-notes.md
