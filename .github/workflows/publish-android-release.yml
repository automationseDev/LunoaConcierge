name: Publish Android v1.1.18

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.1.18 APK
        run: |
          cp dist/LunoaConcierge-v1.1.18.apk LunoaConcierge-v1.1.18.apk
          test -s LunoaConcierge-v1.1.18.apk
          echo '3f92bae8b59d718e4c6e9e40c947ab0dfd071050a6877dd5a403f59e3a18ffb7  LunoaConcierge-v1.1.18.apk' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.1.18

          - 細かなバグの修正

          Android 8.0以降。正式パッケージIDは net.automationse.lunoaconcierge です。

          SHA-256: 3f92bae8b59d718e4c6e9e40c947ab0dfd071050a6877dd5a403f59e3a18ffb7
          EOF
          if gh release view v1.1.18 >/dev/null 2>&1; then
            gh release upload v1.1.18 LunoaConcierge-v1.1.18.apk --clobber
            gh release edit v1.1.18 --title 'Lunoa Concierge v1.1.18' --notes-file release-notes.md --latest
          else
            gh release create v1.1.18 LunoaConcierge-v1.1.18.apk --title 'Lunoa Concierge v1.1.18' --notes-file release-notes.md --latest
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" = 'v1.1.18'
          gh release view v1.1.18 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.1.18.apk'
