name: Publish Android v1.2.1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.2.1 APK
        run: |
          cp dist/LunoaConcierge-v1.2.1.apk LunoaConcierge-v1.2.1.apk
          test -s LunoaConcierge-v1.2.1.apk
          echo '0f278bc27d3fa75d69c59bbedaee817400a16808eef2ed0ee06066c0d952ac17  LunoaConcierge-v1.2.1.apk' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.2.1

          - 横断検索の対象にLunoaメモを追加
          - メモのタイトル、本文、添付ファイル名を検索可能
          - 検索結果から該当メモの編集画面を直接表示

          Android 8.0以降。正式パッケージIDは net.automationse.lunoaconcierge です。

          SHA-256: 0f278bc27d3fa75d69c59bbedaee817400a16808eef2ed0ee06066c0d952ac17
          EOF
          if gh release view v1.2.1 >/dev/null 2>&1; then
            gh release upload v1.2.1 LunoaConcierge-v1.2.1.apk --clobber
            gh release edit v1.2.1 --title 'Lunoa Concierge v1.2.1' --notes-file release-notes.md --latest
          else
            gh release create v1.2.1 LunoaConcierge-v1.2.1.apk --title 'Lunoa Concierge v1.2.1' --notes-file release-notes.md --latest
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" = 'v1.2.1'
          gh release view v1.2.1 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.2.1.apk'
