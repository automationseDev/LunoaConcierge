name: Publish Android v1.4.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.4.0 APK
        run: |
          cp dist/LunoaConcierge-v1.4.0.apk LunoaConcierge-v1.4.0.apk
          test -s LunoaConcierge-v1.4.0.apk
          echo 'bbabd40d37a3096f5c5a1517e0f010f4e7aa04c4a062c993db607848d5112682  LunoaConcierge-v1.4.0.apk' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.4.0

          - お気に入りアプリのアイコンから、登録済みアプリペアを直接起動
          - ホーム画面のルノア周辺に、2つのアプリアイコンを組み合わせたペアアイコンを表示
          - ペアアイコンをタップして分割起動、長押ししてアプリペア管理画面を表示
          - フローティングランチャーのお気に入りからもアプリペアを起動

          Android 8.0以降。正式パッケージIDは net.automationse.lunoaconcierge です。
          SHA-256: bbabd40d37a3096f5c5a1517e0f010f4e7aa04c4a062c993db607848d5112682
          EOF
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 LunoaConcierge-v1.4.0.apk --clobber
            gh release edit v1.4.0 --title 'Lunoa Concierge v1.4.0' --notes-file release-notes.md --latest
          else
            gh release create v1.4.0 LunoaConcierge-v1.4.0.apk --title 'Lunoa Concierge v1.4.0' --notes-file release-notes.md --latest
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" = 'v1.4.0'
          gh release view v1.4.0 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.4.0.apk'
