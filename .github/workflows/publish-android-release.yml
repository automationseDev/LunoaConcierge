name: Publish Android v1.3.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.3.0 APK
        run: |
          cp dist/LunoaConcierge-v1.3.0.apk LunoaConcierge-v1.3.0.apk
          test -s LunoaConcierge-v1.3.0.apk
          echo 'dc99c48449fc902c1df7215c02b80c34749ba04729eeaf1343f0e14528e0194e  LunoaConcierge-v1.3.0.apk' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.3.0

          - 「今日のLunoa」で天気、ニュース、予定、リマインダー、最近のメモや通知をまとめて確認
          - 自然な言葉からメモ、リマインダー、カレンダー、検索の操作を提案し、確認後に実行
          - AIトークン設定時はGemini/OpenAIを利用し、未設定時は端末内で判断
          - ホームのショートカットを表示・非表示、アイコン表示、並び順までカスタマイズ
          - 設定画面で上下操作とドラッグ操作による並び替えに対応し、ショートカット間隔を統一

          Android 8.0以降。正式パッケージIDは net.automationse.lunoaconcierge です。
          SHA-256: dc99c48449fc902c1df7215c02b80c34749ba04729eeaf1343f0e14528e0194e
          EOF
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 LunoaConcierge-v1.3.0.apk --clobber
            gh release edit v1.3.0 --title 'Lunoa Concierge v1.3.0' --notes-file release-notes.md --latest
          else
            gh release create v1.3.0 LunoaConcierge-v1.3.0.apk --title 'Lunoa Concierge v1.3.0' --notes-file release-notes.md --latest
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" = 'v1.3.0'
          gh release view v1.3.0 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.3.0.apk'
