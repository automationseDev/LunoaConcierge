name: Publish Android Release

on:
  push:
    branches: [main]
    paths:
      - 'dist/LunoaConcierge-v1.0.5.apk'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish v1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.5"
          APK="dist/LunoaConcierge-v1.0.5.apk"
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOF'
          ## Lunoa Concierge v1.0.5

          - ホームのお気に入りアイコン間隔を5段階で調整可能
          - 17個以上のお気に入りを実際の行数に合わせて均等配置
          - アイコン同士が詰まりすぎる表示を改善
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Lunoa Concierge $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "Lunoa Concierge $TAG" --notes-file "$NOTES"
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name')" = "v1.0.5"
          gh release view v1.0.5 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.0.5.apk'
