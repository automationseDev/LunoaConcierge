name: Publish Android Release

on:
  push:
    branches: [main]
    paths:
      - 'dist/LunoaConcierge-v1.0.4.apk'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish v1.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.4"
          APK="dist/LunoaConcierge-v1.0.4.apk"
          NOTES=$(mktemp)
          cat > "$NOTES" <<'EOF'
          ## Lunoa Concierge v1.0.4

          - Bug Fix
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "Lunoa Concierge $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "Lunoa Concierge $TAG" --notes-file "$NOTES"
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '.tag_name')" = "v1.0.4"
          gh release view v1.0.4 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.0.4.apk'
