name: Publish Android v1.2.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify v1.2.0 APK
        run: |
          cp dist/LunoaConcierge-v1.2.0.apk LunoaConcierge-v1.2.0.apk
          test -s LunoaConcierge-v1.2.0.apk
          echo 'ede4d747fb70e0aaaedbd6e75c7aa86754d2ec29430a3488da27d40060b598da  LunoaConcierge-v1.2.0.apk' | sha256sum --check -
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.2.0

          - Lunoa単独で使える「何でもメモ」を追加
          - Android共有、手動作成、検索、編集、削除、複数画像の差し込みに対応
          - Z Fold Workspaceを端末非依存の「Lunoa Workspace」へ刷新
          - MemoBrain連携をLunoa内蔵メモへ置き換え

          Android 8.0以降。正式パッケージIDは net.automationse.lunoaconcierge です。

          SHA-256: ede4d747fb70e0aaaedbd6e75c7aa86754d2ec29430a3488da27d40060b598da
          EOF
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 LunoaConcierge-v1.2.0.apk --clobber
            gh release edit v1.2.0 --title 'Lunoa Concierge v1.2.0' --notes-file release-notes.md --latest
          else
            gh release create v1.2.0 LunoaConcierge-v1.2.0.apk --title 'Lunoa Concierge v1.2.0' --notes-file release-notes.md --latest
          fi
      - name: Verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" = 'v1.2.0'
          gh release view v1.2.0 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.2.0.apk'
