name: Publish Migration Develop APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-android-release.yml']
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified migration develop APK
        env:
          ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-0670-8230-8e5d-a4f9878ad9c1/raw?se=2026-09-02T12%3A21%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=01a06208-6f21-71f8-8a7c-82203dc874ab&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T01%3A10%3A28Z&ske=2026-09-03T01%3A10%3A28Z&sks=b&skv=2026-02-06&sig=%2BTXlkXwjqgjd2zBKBLWhfsaZl6LBtAXGVtWB37IP9Vg%3D"
        run: |
          curl --fail --location "$ARTIFACT_URL" --output migration.zip
          unzip migration.zip
          mv app-debug.apk LunoaConcierge-v1.1.0-migration-develop.apk
          test -s LunoaConcierge-v1.1.0-migration-develop.apk
      - name: Add migration APK to public v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.0 LunoaConcierge-v1.1.0-migration-develop.apk --clobber
          cat > release-notes.md <<'EOF'
          ## Lunoa Concierge v1.1.0

          - アプリ内に「はじめてガイド・使い方」を追加
          - 設定のJSONエクスポート／インポートを追加
          - APIキーなどの機密情報は既定でバックアップ対象外
          - develop版から正式版への設定移行に対応
          - 正式パッケージID net.automationse.lunoaconcierge で配布

          ### develop版から移行する方

          1. LunoaConcierge-v1.1.0-migration-develop.apk を既存develop版へ上書きインストール
          2. 設定 → 設定のエクスポート／インポート → エクスポート
          3. 正式版 LunoaConcierge-v1.1.0.apk をインストール
          4. 正式版で同じファイルをインポート

          Androidの権限は正式版で再設定してください。移行後はdevelop版をアンインストールできます。
          EOF
          gh release edit v1.1.0 --title "Lunoa Concierge v1.1.0" --notes-file release-notes.md --latest
      - name: Verify both public APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.0 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.1.0.apk'
          gh release view v1.1.0 --json assets --jq '.assets[].name' | grep -Fx 'LunoaConcierge-v1.1.0-migration-develop.apk'
