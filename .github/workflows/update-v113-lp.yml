name: Update v1.1.3 LP

on:
  push:
    branches: [main]
    paths: ['.github/workflows/update-v113-lp.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LP version and download links
        run: |
          sed -i 's/v1\.1\.2/v1.1.3/g' docs/index.html
          sed -i 's/v1.1.3 · Clean & Long Screenshot/v1.1.3 · Stable Long Screenshot/g' docs/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/update-v113-lp.yml
          git add docs/index.html .github/workflows/update-v113-lp.yml
          git commit -m 'docs: update LP to v1.1.3'
          git push
